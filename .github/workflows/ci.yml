name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6  # same major version as Neon
        env:
          POSTGRES_USER: marquee
          POSTGRES_PASSWORD: marquee
          POSTGRES_DB: marquee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marquee -d marquee_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      MARQUEE_TEST_DATABASE_URL: postgresql://marquee:marquee@localhost:5432/marquee_test
      # Fail, rather than skip, if the integration tests can't find their database.
      MARQUEE_REQUIRE_DB_TESTS: "1"
    steps:
      # Actions are pinned to the commit of a specific release, never a floating tag or branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
