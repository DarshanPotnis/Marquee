[project]
name = "marquee"
version = "0.1.0"
description = "Los Angeles music events from the Ticketmaster Discovery API into Postgres, with checks and a freshness dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["marquee"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/marquee", "dashboard"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p pytester"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
